name: Build extension

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and publish extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Chrome extension
        run: bun run build

      - name: Verify extension output
        run: |
          test -f extension/manifest.json
          test -f extension/background.js
          test -f extension/popup.html
          test -f extension/content-scripts/content.js
          jq -e '.manifest_version == 3' extension/manifest.json > /dev/null

      - name: Publish generated extension
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all extension
          if git diff --cached --quiet; then
            echo 'No generated extension changes to commit.'
            exit 0
          fi
          git commit -m 'chore: update Chrome extension build [skip ci]'
          git push
